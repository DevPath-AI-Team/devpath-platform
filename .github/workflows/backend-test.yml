name: Backend Java Testleri

on:
  push:
    branches: [ "son-backend" ] 
  pull_request:
    branches: [ "son-backend" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 'gradle-version: 8.5' diyerek sunucuya taze Gradle kurduruyoruz.
    # Böylece "dosya kilitli", "izin yok" hatası imkansız hale geliyor.
    - name: Testleri Çalıştır
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.5'
        arguments: test
