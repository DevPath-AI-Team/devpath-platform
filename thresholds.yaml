# ==============================================
# DEVPATH AI - BAŞARI EŞİK DEĞERLERİ
# ==============================================

# Tüm değerler yüzde (%) cinsindendir

# ==============================================
# GENEL BAŞARI SEVİYELERİ
# ==============================================

performance_levels:
  # Başarı Kategorileri
  categories:
    expert:
      min_score: 90
      max_score: 100
      color: "#10B981"  # Yeşil
      description: "Uzman Seviye"
      badge: "🥇"
      
    advanced:
      min_score: 80
      max_score: 89
      color: "#3B82F6"  # Mavi
      description: "İleri Seviye"
      badge: "🥈"
      
    intermediate:
      min_score: 70
      max_score: 79
      color: "#F59E0B"  # Turuncu
      description: "Orta Seviye"
      badge: "🥉"
      
    beginner:
      min_score: 50
      max_score: 69
      color: "#EF4444"  # Kırmızı
      description: "Başlangıç Seviye"
      badge: "📚"
      
    novice:
      min_score: 0
      max_score: 49
      color: "#6B7280"  # Gri
      description: "Yeni Başlayan"
      badge: "🎯"

# ==============================================
# KONU BAZLI EŞİKLER
# ==============================================

topic_thresholds:
  # Konu Durumları
  status:
    mastered:
      min_score: 85
      description: "Tamamen öğrenildi"
      action: "İleri konulara geç"
      icon: "✅"
      
    proficient:
      min_score: 70
      max_score: 84
      description: "Yeterli seviyede"
      action: "Pekiştirme yap"
      icon: "👍"
      
    needs_improvement:
      min_score: 50
      max_score: 69
      description: "Geliştirme gerekli"
      action: "Tekrar et ve pratik yap"
      icon: "⚠️"
      
    weak:
      min_score: 0
      max_score: 49
      description: "Zayıf alan"
      action: "Temelden öğren"
      icon: "🔴"
  
  # Öncelik Hesaplama
  priority_calculation:
    # Formül: Priority = (score_factor * 0.5) + (level_factor * 0.3) + (time_factor * 0.2)
    
    # Puan faktörü (düşük puan = yüksek öncelik)
    score_factor:
      weight: 0.5
      calculation: "100 - current_score"
      
    # Seviye faktörü (temel konular öncelikli)
    level_factor:
      weight: 0.3
      values:
        beginner: 10
        intermediate: 5
        advanced: 2
        expert: 0
        
    # Süre faktörü (kısa süreli konular öncelikli)
    time_factor:
      weight: 0.2
      calculation: "(1 / duration) * 10"
      
  # Öncelik Kategorileri
  priority_levels:
    critical:
      min_score: 8.0
      max_score: 10.0
      color: "#DC2626"  # Kırmızı
      description: "Kritik - Hemen çalış"
      
    high:
      min_score: 6.0
      max_score: 7.9
      color: "#EA580C"  # Turuncu
      description: "Yüksek - Yakında çalış"
      
    medium:
      min_score: 4.0
      max_score: 5.9
      color: "#F59E0B"  # Sarı
      description: "Orta - Planla"
      
    low:
      min_score: 2.0
      max_score: 3.9
      color: "#10B981"  # Yeşil
      description: "Düşük - İleride çalış"
      
    minimal:
      min_score: 0.0
      max_score: 1.9
      color: "#6B7280"  # Gri
      description: "Minimal - Gözden geçir"

# ==============================================
# TEST EŞİKLERİ
# ==============================================

test_thresholds:
  # Test Sonuçları
  results:
    excellent: 90
    good: 80
    average: 70
    needs_work: 50
    poor: 0
  
  # Zorluk Seviyelerine Göre Eşikler
  by_difficulty:
    beginner:
      easy: 80
      medium: 70
      hard: 60
      
    intermediate:
      easy: 85
      medium: 75
      hard: 65
      
    advanced:
      easy: 90
      medium: 80
      hard: 70
      
    expert:
      easy: 95
      medium: 85
      hard: 75
  
  # Zaman Yönetimi Eşikleri
  time_management:
    too_fast: 0.5    # Tahminin yarısından az süre
    optimal_min: 0.8
    optimal_max: 1.2
    too_slow: 2.0    # Tahminin 2 katından fazla süre
    
  # İyileşme Eşikleri
  improvement:
    significant: 15   # %15+ iyileşme
    moderate: 5      # %5-15 iyileşme
    minimal: 2       # %2-5 iyileşme
    stagnant: 0      # %0-2 iyileşme
    regression: -5   # %5+ gerileme

# ==============================================
# ÖĞRENME YOLU PLANLAMA EŞİKLERİ
# ==============================================

learning_path_planning:
  # Haftalık Limitler
  weekly_limits:
    max_hours: 20
    min_hours: 5
    recommended_hours: 10
    
    max_topics: 5
    min_topics: 1
    recommended_topics: 3
    
  # Zorluk Dağılımı
  difficulty_distribution:
    beginner_path:
      easy: 60
      medium: 30
      hard: 10
      
    intermediate_path:
      easy: 40
      medium: 40
      hard: 20
      
    advanced_path:
      easy: 20
      medium: 40
      hard: 40
      
  # İlerleme Hedefleri
  progress_targets:
    weekly_improvement_target: 10    # Haftalık %10 iyileşme
    topic_completion_rate: 80        # Konuların %80'ini tamamlama
    time_efficiency_target: 0.9      # %90 zaman verimliliği
    
  # Uyarı Eşikleri
  warning_thresholds:
    low_progress: 2          # Haftalık %2'den az ilerleme
    high_regression: -5      # %5'ten fazla gerileme
    time_inefficiency: 2.0   # 2x'den fazla süre
    low_engagement: 30       %30'dan az katılım

# ==============================================
# KAYNAK ÖNERİ EŞİKLERİ
# ==============================================

resource_recommendation:
  # Puan Aralıklarına Göre Kaynak Türleri
  by_score_range:
    - range: [0, 40]
      resource_types: ["beginner_tutorial", "video", "interactive_exercise"]
      intensity: "high"
      focus: "temel kavramlar"
      estimated_time: "2-3 saat"
      
    - range: [40, 60]
      resource_types: ["intermediate_tutorial", "practice_problems", "examples"]
      intensity: "medium"
      focus: "pratik ve uygulama"
      estimated_time: "3-4 saat"
      
    - range: [60, 75]
      resource_types: ["advanced_tutorial", "mini_project", "documentation"]
      intensity: "medium"
      focus: "derinlemesine anlama"
      estimated_time: "4-5 saat"
      
    - range: [75, 85]
      resource_types: ["expert_resources", "real_world_project", "optimization"]
      intensity: "low"
      focus: "uzmanlaşma"
      estimated_time: "5-6 saat"
      
    - range: [85, 100]
      resource_types: ["research_paper", "advanced_project", "mentoring"]
      intensity: "minimal"
      focus: "ustalaşma"
      estimated_time: "6+ saat"
  
  # Kaynak Kalite Eşikleri
  quality_thresholds:
    minimum_rating: 4.0
    minimum_reviews: 10
    maximum_age_days: 365  # 1 yıl
    preferred_languages: ["tr", "en"]

# ==============================================
# MOTİVASYON ve GERİ BİLDİRİM EŞİKLERİ
# ==============================================

motivation:
  # Başarı Rozetleri
  achievement_badges:
    first_test_completed:
      threshold: 1
      badge: "🚀"
      name: "İlk Test"
      
    perfect_score:
      threshold: 100
      badge: "🏆"
      name: "Mükemmel Skor"
      
    streak_3_days:
      threshold: 3
      badge: "🔥"
      name: "3 Günlük Seri"
      
    streak_7_days:
      threshold: 7
      badge: "⭐"
      name: "7 Günlük Seri"
      
    topic_master:
      threshold: 90
      badge: "👑"
      name: "Konu Ustası"
      
    weekly_goal_achiever:
      threshold: 80
      badge: "🎯"
      name: "Haftalık Hedef"
  
  # Zorluk Ayarlama
  difficulty_adjustment:
    too_easy_threshold: 90      # %90 üzeri başarı
    too_hard_threshold: 40      # %40 altı başarı
    optimal_range: [60, 80]     # Optimal başarı aralığı
    
    adjustment_steps:
      increase_difficulty: 10   # %10 zorluk artışı
      decrease_difficulty: 15   # %15 zorluk azalışı
  
  # Geri Bildirim Noktaları
  feedback_points:
    milestone_achieved: true
    progress_update: true
    streak_broken: true
    goal_completed: true
    improvement_shown: true

# ==============================================
# ZAMAN YÖNETİMİ EŞİKLERİ
# ==============================================

time_management:
  # Konu Başına Tahmini Süreler (saat)
  estimated_times:
    easy: 2
    medium: 4
    hard: 6
    expert: 8
  
  # Gerçek/Tahmini Süre Oranları
  time_ratios:
    excellent: [0.8, 1.0]    # %80-100
    good: [0.6, 0.8]         # %60-80
    average: [1.0, 1.5]      # %100-150
    poor: [1.5, 2.0]         # %150-200
    very_poor: [2.0, null]   # %200+ 
  
  # Çalışma Oturumu Ayarları
  study_sessions:
    optimal_session_length: 60      # dakika
    break_between_sessions: 15      # dakika
    max_daily_sessions: 4
    min_weekly_sessions: 7
  
  # Uyarı Eşikleri
  warning_thresholds:
    burnout_risk: 15    # Haftalık 15+ saat
    insufficient_effort: 5  # Haftalık 5- saat
    irregular_schedule: 3   # Haftada 3- gün

# ==============================================
# İLERLEME TAKİP EŞİKLERİ
# ==============================================

progress_tracking:
  # Haftalık İlerleme Hedefleri
  weekly_improvement_targets:
    beginner: 15      # %15
    intermediate: 10  # %10
    advanced: 5       # %5
    expert: 2         # %2
  
  # Minimum İlerleme (Durgunluk Eşiği)
  min_weekly_improvement: 2    # %2
  
  # Maksimum Gerileme (Uyarı Eşiği)
  max_weekly_regression: -5    # -%5
  
  # Tamamlama Oranları
  completion_rates:
    excellent: 90     # %90+
    good: 75         # %75-90
    average: 60      # %60-75
    poor: 40         # %40-60
    very_poor: 0     # %0-40
  
  # Tutarlılık Metrikleri
  consistency_metrics:
    attendance_rate: 80    # %80 katılım
    completion_rate: 70    # %70 tamamlama
    improvement_rate: 5    # %5 iyileşme

# ==============================================
# SİSTEM PERFORMANS EŞİKLERİ
# ==============================================

system_performance:
  # API Yanıt Süreleri (milisaniye)
  api_response_times:
    excellent: 100
    good: 200
    acceptable: 500
    poor: 1000
    unacceptable: 2000
  
  # Sistem Yükü
  system_load:
    cpu_warning: 80        # %80 CPU
    memory_warning: 85     # %85 Memory
    disk_warning: 90       # %90 Disk
  
  # Hata Oranları
  error_rates:
    acceptable: 1          # %1
    warning: 5            # %5
    critical: 10          # %10